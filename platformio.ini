; ESP32-ogrzewanie – termostat ESP32-C3 + ST7796 + XPT2046 + SHT31
; Kompilacja:  pio run      Wgranie:  pio run -t upload     Monitor:  pio device monitor

[env:lolin_c3_mini]
; Arduino-ESP32 3.x (pioarduino); z klasyczną platformą "espressif32" też działa
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = lolin_c3_mini
framework = arduino
board_build.partitions = no_ota.csv   ; aplikacja ~1,3 MB > domyślne 1,2 MB
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.7
