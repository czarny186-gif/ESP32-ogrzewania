name: Kompilacja ESP32-C3 (PlatformIO)

on:
  push:
    branches:
      - feature/thermostat-safety-manual-clock
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Zainstaluj PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Kompiluj firmware ESP32-C3
        run: pio run -e lolin_c3_mini
      - name: Udostepnij plik BIN
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-ogrzewania-firmware
          path: |
            .pio/build/lolin_c3_mini/firmware.bin
            .pio/build/lolin_c3_mini/bootloader.bin
            .pio/build/lolin_c3_mini/partitions.bin
          if-no-files-found: warn
